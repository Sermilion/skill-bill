# Decomposition manifest bundle journal schema (canonical source of truth).
#
# Describes the on-disk commit marker for atomic multi-file decomposition manifest
# writes under a single parent directory. Consumed as JSON Schema (Draft 2020-12)
# by `DecompositionManifestBundleJournalSchemaValidator` in `runtime-infra-fs`.
#
# Versioning rule:
#
# - `contract_version` is pinned by `BUNDLE_JOURNAL_CONTRACT_VERSION` in
#   `runtime-kotlin/runtime-contracts/.../DecompositionManifestBundleJournalSchemaPaths.kt`.
# - `DecompositionManifestBundleJournalSchemaContractVersionTest` fails the build
#   if they diverge. Historical 0.1 records use the same envelope shape.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/decomposition-manifest-bundle-journal-schema.yaml"
title: "Decomposition manifest bundle journal"
description: >
  Commit marker for staged, digest-checked moves that project decomposition manifest
  bundle writes to their target paths. Recovery validates this record before applying
  pending moves or deleting staging evidence.
type: object
additionalProperties: false
required:
  - contract_version
  - staging_directory
  - entries
$defs:
  entry:
    type: object
    additionalProperties: false
    required:
      - target
      - staged
      - sha256
    properties:
      target:
        type: string
        minLength: 1
      staged:
        type: string
        minLength: 1
      sha256:
        type: string
        minLength: 64
        maxLength: 64
properties:
  contract_version:
    const: "0.1"
  staging_directory:
    type: string
    minLength: 1
  entries:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/entry"
