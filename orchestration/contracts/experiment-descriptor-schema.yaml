$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/experiment-descriptor-schema.yaml"
title: Experiment descriptor record
description: >
  Registry descriptor for a supported experiment. Executable bindings live at the
  composition root; descriptors do not carry arbitrary commands.
type: object
additionalProperties: false
required:
  - contract_version
  - name
  - descriptor_version
  - execution_mode
  - required_launcher_capabilities
  - treatment_capability
properties:
  contract_version:
    const: "0.1"
  name:
    type: string
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
    minLength: 1
    maxLength: 64
  descriptor_version:
    type: string
    minLength: 1
    maxLength: 32
  execution_mode:
    type: string
    enum:
      - goal_pair
      - navigation
  required_launcher_capabilities:
    type: array
    minItems: 0
    maxItems: 32
    items:
      type: string
      minLength: 1
      maxLength: 128
  treatment_capability:
    type: string
    minLength: 1
    maxLength: 128
  setup_requirements:
    type: array
    minItems: 0
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 256
  measurement_requirements:
    type: array
    minItems: 0
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 256
