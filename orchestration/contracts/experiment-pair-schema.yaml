$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/experiment-pair-schema.yaml"
title: Experiment pair durable record
description: >
  Parent-owned pair lifecycle, frozen selection, arm order, and delivery status.
type: object
additionalProperties: false
required:
  - contract_version
  - pair_id
  - execution_mode
  - selected_experiment_names
  - arm_order
  - delivery_arm
  - pair_status
  - frozen_input_identity
properties:
  contract_version:
    const: "0.1"
  pair_id:
    type: string
    minLength: 1
    maxLength: 128
  execution_mode:
    type: string
    enum:
      - goal_pair
      - navigation
  selected_experiment_names:
    type: array
    minItems: 0
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 64
  arm_order:
    type: array
    minItems: 2
    maxItems: 2
    items:
      type: string
      enum:
        - control
        - treatment
  random_seed:
    type: string
    minLength: 1
    maxLength: 128
  delivery_arm:
    type: string
    enum:
      - control
      - treatment
      - undecided
  pair_status:
    type: string
    enum:
      - pending
      - running
      - paused
      - completed
      - failed
      - cancelled
  frozen_input_identity:
    type: object
    additionalProperties: false
    required:
      - repository_identity
      - source_commit_sha
      - source_tree_sha
      - spec_bundle_hash
      - effective_config_hash
      - skill_bill_version
    properties:
      repository_identity:
        type: string
        minLength: 1
      source_commit_sha:
        type: string
        minLength: 1
      source_tree_sha:
        type: string
        minLength: 1
      spec_bundle_hash:
        type: string
        minLength: 1
      effective_config_hash:
        type: string
        minLength: 1
      run_settings_hash:
        type: string
        minLength: 1
      phase_routes_hash:
        type: string
        minLength: 1
      pack_addon_hash:
        type: string
        minLength: 1
      provider_model_effort:
        type: string
        minLength: 1
      skill_bill_version:
        type: string
        minLength: 1
  arm_outcomes:
    type: array
    minItems: 0
    maxItems: 2
    items:
      $ref: "#/$defs/armOutcome"
  delivery_status:
    type: string
    enum:
      - deferred
      - ready
      - published
      - blocked
      - not_applicable
$defs:
  armOutcome:
    type: object
    additionalProperties: false
    required:
      - arm_id
      - terminal_status
    properties:
      arm_id:
        type: string
        enum:
          - control
          - treatment
      workflow_id:
        type: string
        minLength: 1
      terminal_status:
        type: string
        enum:
          - pending
          - running
          - completed
          - failed
          - skipped
          - paused
      failure_reason:
        type: string
        minLength: 1
        maxLength: 512
      worktree_path:
        type: string
        minLength: 1
      deferred_publication:
        type: boolean
      delivered_paths:
        type: array
        items:
          type: string
          minLength: 1
      shortlisted_paths:
        type: array
        items:
          type: string
          minLength: 1
      read_receipts:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - path
            - purpose
          properties:
            path:
              type: string
              minLength: 1
            purpose:
              type: string
              minLength: 1
      attempt_count:
        type: integer
        minimum: 0
      labelled_criteria:
        type: integer
        minimum: 0
      total_criteria:
        type: integer
        minimum: 0
      precision_available:
        type: boolean
      excluded_paths:
        type: array
        items:
          type: string
          minLength: 1
      restricted_baseline:
        type: boolean
      delivered_criteria:
        type: integer
        minimum: 0
      relevant_reads:
        type: integer
        minimum: 0
      precision:
        type: number
        minimum: 0
